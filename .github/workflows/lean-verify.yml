name: Lean 4 Formal Verification

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lean/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/axiom_audit.sh'
      - '.github/workflows/lean-verify.yml'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'lean/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/axiom_audit.sh'
      - '.github/workflows/lean-verify.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cheap and independent of Lean: catches an assumption added to lean/ before
      # spending six minutes building. See scripts/axiom_audit.sh.
      - name: Audit declared axioms
        run: ./scripts/axiom_audit.sh

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Clean Lake cache (prevents "unknown module prefix" errors)
        run: |
          pkill lean || true
          rm -rf .lake
          lake clean

      # Deliberately NOT `lake update`. The dependency set is pinned in lakefile.lean and
      # recorded in lake-manifest.json, so the build resolves to stated revisions and a green
      # run reproduces. `lake update` re-resolved Mathlib to master on every push, which meant
      # the verification claim was against whatever master happened to be that morning.
      # To advance Mathlib, update the pin and manifest in a commit of their own.
      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build all Lean files (in safe order)
        run: |
          lake build

      # The dependency footprint of the anchor theorems: which axioms the kernel
      # actually used, printed by lean/QLF_AxiomAudit.lean. Re-elaborated on its own so
      # the report is one contiguous block in the log rather than scattered through the
      # build. See that file for how to read it.
      - name: Report axiom footprint of the anchor theorems
        run: lake env lean lean/QLF_AxiomAudit.lean

      # TEMPORARY (issue #146): checks CLAUDE.md's "Lean 4.30 gotchas" against the toolchain
      # we actually build with. Non-blocking — the errors it prints ARE the report. Remove
      # this step and lean/QLF_ToolchainProbe.lean once the results are recorded.
      - name: Probe the documented Lean gotchas
        run: lake env lean lean/QLF_ToolchainProbe.lean || true
