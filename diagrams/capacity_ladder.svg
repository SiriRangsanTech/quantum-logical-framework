<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="512" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">The capacity ladder — three kinds of invariant, three fates</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#6b7280">an exception exists exactly when the invariant's proof is capacity-relative — charge's proof is not, so its bar never ends</text>

  <defs>
    <marker id="onward" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- threshold guides -->
  <line x1="309" y1="92" x2="309" y2="372" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="610" y1="92" x2="610" y2="372" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="309" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">T_c ≈ 155 MeV</text>
  <text x="610" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">T_EW ≈ 160 GeV</text>

  <!-- the three-decade gap -->
  <line x1="315" y1="70" x2="604" y2="70" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="315" y1="66" x2="315" y2="74" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="604" y1="66" x2="604" y2="74" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="459" y="66" text-anchor="middle" font-size="11" fill="#6b7280">≈ 10³ — three decades</text>

  <!-- row 1: composite binding (the proton) -->
  <rect x="90" y="108" width="219" height="44" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="100" y="130" font-size="13" font-weight="700" fill="#92400e">the proton — a bound closure</text>
  <text x="100" y="146" font-size="11" fill="#a16207">composite binding · baryon winding + singlet-only + prime-3 lock</text>
  <text x="319" y="127" font-size="12" font-weight="700" fill="#b91c1c">dissolves</text>
  <text x="319" y="143" font-size="11" fill="#6b7280">quark–gluon plasma — observed (RHIC, LHC)</text>

  <!-- row 2: winding invariant (baryon number) -->
  <rect x="90" y="182" width="520" height="44" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="100" y="204" font-size="13" font-weight="700" fill="#5b21b6">baryon number — a winding invariant</text>
  <text x="100" y="220" font-size="11" fill="#6d28d9">signed 3-axis linking number · baryonNumber</text>
  <!-- the exponentially rare tail before the threshold -->
  <line x1="500" y1="204" x2="606" y2="204" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3 5"/>
  <text x="620" y="200" font-size="12" font-weight="700" fill="#b91c1c">violated</text>
  <text x="620" y="216" font-size="11" fill="#6b7280">sphalerons; below T_EW the rate is</text>
  <text x="620" y="230" font-size="11" fill="#6b7280">~exp(−E_sph/T) — rare, not absent</text>

  <!-- row 3: signed count (electric charge) — no terminator -->
  <rect x="90" y="256" width="700" height="44" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
  <text x="100" y="278" font-size="13" font-weight="700" fill="#065f46">electric charge — an annihilation-odd signed count</text>
  <text x="100" y="294" font-size="11" fill="#047857">signed_count_conserved quantifies over every history — no depth, no excursion budget</text>
  <line x1="790" y1="278" x2="838" y2="278" stroke="#059669" stroke-width="2.6" marker-end="url(#onward)"/>
  <text x="806" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">no threshold</text>
  <text x="806" y="296" text-anchor="middle" font-size="11" fill="#047857">at any scale</text>
  <text x="100" y="316" font-size="10.5" fill="#6b7280">carrier note: a photon still terminates — at a resonant absorber, by <tspan font-style="italic">matching</tspan> rather than exhaustion; in QLF it <tspan font-style="italic">is</tspan> that joint closure (§4c)</text>

  <text x="464" y="342" text-anchor="middle" font-size="12" fill="#374151">available capacity (log energy scale) →</text>

  <!-- energy axis (log) -->
  <line x1="90" y1="372" x2="838" y2="372" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="90" y="392" text-anchor="middle" font-size="11" fill="#6b7280">1 MeV</text>
  <text x="309" y="392" text-anchor="middle" font-size="11" fill="#6b7280">155 MeV</text>
  <text x="390" y="392" text-anchor="middle" font-size="11" fill="#6b7280">1 GeV</text>
  <text x="610" y="392" text-anchor="middle" font-size="11" fill="#6b7280">160 GeV</text>
  <text x="790" y="392" text-anchor="middle" font-size="11" fill="#6b7280">10 TeV</text>
  <line x1="90" y1="368" x2="90" y2="376" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="309" y1="368" x2="309" y2="376" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="390" y1="368" x2="390" y2="376" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="610" y1="368" x2="610" y2="376" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="790" y1="368" x2="790" y2="376" stroke="#9ca3af" stroke-width="1.4"/>
  <!-- carrier mass scales: each threshold sits at its sector's mass scale; the massless carrier has none -->
  <text x="96" y="416" font-size="11" font-weight="700" fill="#374151">carrier mass scale:</text>
  <path d="M320,404 L316,412 L324,412 z" fill="#0891b2"/>
  <text x="320" y="428" text-anchor="middle" font-size="11" fill="#0e7490">Λ_QCD ≈ 200 MeV</text>
  <path d="M581,404 L577,412 L585,412 z" fill="#0891b2"/>
  <path d="M629,404 L625,412 L633,412 z" fill="#0891b2"/>
  <text x="605" y="428" text-anchor="middle" font-size="11" fill="#0e7490">m_W 80 · m_Z 91 · v 246 GeV</text>
  <text x="806" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">m_γ = 0</text>
  <text x="806" y="430" text-anchor="middle" font-size="11" fill="#047857">nowhere to sit</text>
  <text x="464" y="446" text-anchor="middle" font-size="11.5" fill="#0e7490">each threshold sits at its sector's carrier-mass scale — and the massless carrier has no scale to sit at</text>

  <!-- the rule -->
  <rect x="90" y="458" width="748" height="46" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/>
  <text x="464" y="477" text-anchor="middle" font-size="12.5" fill="#111827">A conservation law's exception scale is set by <tspan font-weight="700">what kind of invariant its proof uses</tspan> — capacity-relative (binding, winding) ⟹ an exception exists; a signed count ⟹ none.</text>
  <text x="464" y="495" text-anchor="middle" font-size="12" fill="#374151">In QLF: mass <tspan font-style="italic">is</tspan> constructing delay <tspan font-style="italic">is</tspan> depth <tspan font-style="italic">is</tspan> capacity — so a massless carrier is a zero-capacity one, and light is the exceptionless case.</text>
</svg>
