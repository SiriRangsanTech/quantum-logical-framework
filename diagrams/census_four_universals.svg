<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">One discrete census — four continuum universals</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#6b7280">the closure census is a closed random walk; every famous scaling law is one reading of it</text>

  <!-- arrows (drawn first, under the boxes) -->
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g stroke="#9ca3af" stroke-width="1.8" fill="none" marker-end="url(#arw)">
    <line x1="300" y1="205" x2="205" y2="150"/>
    <line x1="460" y1="205" x2="555" y2="150"/>
    <line x1="300" y1="255" x2="205" y2="310"/>
    <line x1="460" y1="255" x2="555" y2="310"/>
  </g>

  <!-- center: the census -->
  <g transform="translate(380,230)">
    <circle r="72" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2"/>
    <text x="0" y="-30" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">CLOSURE</text>
    <text x="0" y="-13" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">CENSUS</text>
    <text x="0" y="8" text-anchor="middle" font-size="12" fill="#374151">closed ±1 walk</text>
    <text x="0" y="26" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">C(2n,n)</text>
    <text x="0" y="45" text-anchor="middle" font-size="10.5" fill="#6b7280">QLF_CensusBrownian</text>
  </g>

  <!-- TOP-LEFT: pi -->
  <g transform="translate(40,96)">
    <rect width="168" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="84" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">π</text>
    <text x="84" y="46" text-anchor="middle" font-size="12" fill="#111827">1 / (n · returnDensity) → π</text>
    <text x="84" y="63" text-anchor="middle" font-size="10.5" fill="#6b7280">Wallis · QLF_PhysicalPi</text>
  </g>

  <!-- TOP-RIGHT: -5/3 -->
  <g transform="translate(552,96)">
    <rect width="168" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="84" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Kolmogorov −5/3</text>
    <text x="84" y="46" text-anchor="middle" font-size="12" fill="#111827">E(k) ∝ k^(−5/3)</text>
    <text x="84" y="63" text-anchor="middle" font-size="10.5" fill="#6b7280">log 2 / octave · QLF_Kolmogorov</text>
  </g>

  <!-- BOTTOM-LEFT: 1/f -->
  <g transform="translate(40,292)">
    <rect width="168" height="74" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="84" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">1/f pink noise</text>
    <text x="84" y="46" text-anchor="middle" font-size="12" fill="#111827">S(f) ∝ 1/f</text>
    <text x="84" y="63" text-anchor="middle" font-size="10.5" fill="#6b7280">p=2 return density</text>
  </g>

  <!-- BOTTOM-RIGHT: Zipf -->
  <g transform="translate(552,292)">
    <rect width="168" height="74" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
    <text x="84" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">Zipf's law</text>
    <text x="84" y="46" text-anchor="middle" font-size="12" fill="#111827">f(r) ∝ 1/r  (exp 1.00, p-indep.)</text>
    <text x="84" y="63" text-anchor="middle" font-size="10.5" fill="#6b7280">random-text · discrete-native</text>
  </g>

  <!-- footer -->
  <text x="380" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">The continuum is the rendering — not the source.</text>
  <text x="380" y="444" text-anchor="middle" font-size="11.5" fill="#6b7280">Zipf has no clean continuum form, yet falls out of the count: native evidence the discrete substrate is fundamental.</text>
</svg>
