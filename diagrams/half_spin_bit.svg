<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">The atom of information — the two-valued ½-spin closure</text>
  <text x="440" y="54" text-anchor="middle" font-size="13" fill="#6b7280">a single-valued object carries no bit; only the spinor, which records −I ≠ +I, carries one (it from bit, after Cartan 1913)</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>

  <!-- left: the double-cover loop -->
  <text x="165" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">360° → −I</text>
  <circle cx="165" cy="235" r="74" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M165,161 A74,74 0 1 1 118,205" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="165" y="230" text-anchor="middle" font-size="15" fill="#92400e">Hermitian pair</text>
  <text x="165" y="250" text-anchor="middle" font-size="14" font-family="ui-monospace, monospace" fill="#92400e">t · t† = −I</text>
  <text x="165" y="345" text-anchor="middle" font-size="13" fill="#6b7280">720° = two pairs → +I</text>

  <!-- right: the two alphabets -->
  <!-- single-valued -->
  <rect x="360" y="120" width="210" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="465" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">single-valued</text>
  <text x="465" y="165" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace" fill="#374151">{ +I }</text>
  <line x1="575" y1="148" x2="620" y2="148" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="632" y="143" font-size="16" font-weight="700" fill="#374151">0 bits</text>
  <text x="632" y="164" font-size="13" font-family="ui-monospace, monospace" fill="#6b7280">binary_kl 1 1 = 0</text>
  <text x="632" y="185" font-size="12" fill="#9ca3af">vector · integer spin · blind to the turn</text>

  <!-- two-valued -->
  <rect x="360" y="238" width="210" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">two-valued</text>
  <text x="465" y="283" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace" fill="#1d4ed8">{ +I , −I }</text>
  <line x1="575" y1="266" x2="620" y2="266" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arb)"/>
  <text x="632" y="261" font-size="16" font-weight="700" fill="#1d4ed8">1 bit = log 2</text>
  <text x="632" y="282" font-size="13" font-family="ui-monospace, monospace" fill="#2563eb">binary_kl 1 (1/2) = log 2</text>
  <text x="632" y="303" font-size="12" fill="#60a5fa">spinor · records −I ≠ +I</text>

  <text x="440" y="392" text-anchor="middle" font-size="13" fill="#6b7280">the bit enters exactly with the −I sign; log 2 is the MRE maximum, attained only at this delta realization (QLF_SpinorInformation, QLF_FreeEnergy)</text>
</svg>
