<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="540" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">The logical bang — nested phases, drawn from the inside</text>
  <text x="410" y="52" text-anchor="middle" font-size="13" fill="#6b7280">a logical origin + nested phase structure; same ZFA logic at every scale (fractal); fast closures resolve before slow</text>

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
  </defs>

  <g transform="translate(280,290)">
    <!-- concentric phase rings -->
    <circle r="190" fill="none" stroke="#c4b5fd" stroke-width="1.6"/>
    <circle r="145" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
    <circle r="100" fill="none" stroke="#93c5fd" stroke-width="1.6"/>
    <circle r="55"  fill="none" stroke="#7dd3fc" stroke-width="1.6"/>

    <!-- radial "time in every direction" arrows -->
    <g stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ar)">
      <line x1="0" y1="0" x2="128" y2="-128"/><line x1="0" y1="0" x2="182" y2="0"/>
      <line x1="0" y1="0" x2="128" y2="128"/><line x1="0" y1="0" x2="0" y2="182"/>
      <line x1="0" y1="0" x2="-128" y2="128"/><line x1="0" y1="0" x2="-128" y2="-128"/>
    </g>

    <!-- the fast -> slow radial (replaces the west arrow) -->
    <line x1="-38" y1="0" x2="-182" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#aro)"/>
    <rect x="-70" y="-24" width="34" height="14" fill="#ffffff"/><text x="-53" y="-13" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">fast</text>
    <rect x="-178" y="-24" width="36" height="14" fill="#ffffff"/><text x="-160" y="-13" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">slow</text>
    <text x="-108" y="17" text-anchor="middle" font-size="9.5" fill="#ea580c">high f → low f</text>

    <!-- nucleons on the outer ring -->
    <g fill="#7c3aed">
      <circle cx="175.5" cy="72.8" r="5.5"/><circle cx="72.7" cy="175.5" r="5.5"/>
      <circle cx="-72.7" cy="175.5" r="5.5"/><circle cx="-175.5" cy="72.8" r="5.5"/>
      <circle cx="-175.5" cy="-72.8" r="5.5"/><circle cx="-72.7" cy="-175.5" r="5.5"/>
      <circle cx="72.7" cy="-175.5" r="5.5"/><circle cx="175.5" cy="-72.8" r="5.5"/>
    </g>
    <text x="188" y="76" font-size="11" font-weight="700" fill="#5b21b6">p</text>
    <text x="82" y="192" font-size="11" font-weight="700" fill="#5b21b6">n</text>
    <text x="80" y="-182" font-size="11" font-weight="700" fill="#5b21b6">p</text>

    <!-- a self-similar inset: zoom into ring 2 -> the same cascade, slower -->
    <line x1="-71" y1="71" x2="-150" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <g transform="translate(-168,168)">
      <circle r="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle r="18" fill="none" stroke="#93c5fd" stroke-width="1"/><circle r="10" fill="none" stroke="#7dd3fc" stroke-width="1"/>
      <circle r="4" fill="url(#core)"/>
      <g stroke="#cbd5e1" stroke-width="0.8"><line x1="0" y1="0" x2="0" y2="-24"/><line x1="0" y1="0" x2="24" y2="0"/><line x1="0" y1="0" x2="0" y2="24"/><line x1="0" y1="0" x2="-24" y2="0"/><line x1="0" y1="0" x2="17" y2="17"/><line x1="0" y1="0" x2="-17" y2="17"/><line x1="0" y1="0" x2="17" y2="-17"/><line x1="0" y1="0" x2="-17" y2="-17"/></g>
    </g>
    <text x="-168" y="208" text-anchor="middle" font-size="9" fill="#64748b">same cascade, slower</text>

    <!-- the logical bang -->
    <circle r="30" fill="url(#core)" stroke="#b45309" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">LOGICAL</text>
    <text x="0" y="10" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">BANG</text>

    <!-- numbered phase badges -->
    <g>
      <circle cx="0" cy="-190" r="11" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="0" y="-186" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">4</text>
      <circle cx="0" cy="-145" r="11" fill="#fff" stroke="#4f46e5" stroke-width="1.6"/><text x="0" y="-141" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">3</text>
      <circle cx="0" cy="-100" r="11" fill="#fff" stroke="#2563eb" stroke-width="1.6"/><text x="0" y="-96" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">2</text>
      <circle cx="0" cy="-55" r="11" fill="#fff" stroke="#0ea5e9" stroke-width="1.6"/><text x="0" y="-51" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">1</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="12.5">
    <text x="556" y="106" font-size="13" font-weight="700" fill="#111827">The phases (inner → outer)</text>
    <circle cx="566" cy="132" r="11" fill="url(#core)" stroke="#b45309" stroke-width="1.3"/><text x="566" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">0</text>
    <text x="586" y="136" fill="#374151"><tspan font-weight="700">Logical bang</tspan> — the first distinction ([+,−])</text>
    <circle cx="566" cy="162" r="11" fill="#fff" stroke="#0ea5e9" stroke-width="1.4"/><text x="566" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">1</text>
    <text x="586" y="166" fill="#374151"><tspan font-weight="700">Conjugate pairs</tspan> — the first closures</text>
    <circle cx="566" cy="192" r="11" fill="#fff" stroke="#2563eb" stroke-width="1.4"/><text x="566" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">2</text>
    <text x="586" y="196" fill="#374151"><tspan font-weight="700">Octave cascade</tspan> — the turbulent tangle</text>
    <circle cx="566" cy="222" r="11" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="566" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">3</text>
    <text x="586" y="226" fill="#374151"><tspan font-weight="700">Light nuclei</tspan> — primordial matter (⁴He, …)</text>
    <circle cx="566" cy="252" r="11" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="566" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">4</text>
    <text x="586" y="256" fill="#374151"><tspan font-weight="700">Nucleons</tspan> — Borromean baryons (p, n)</text>

    <text x="556" y="300" font-size="13" font-weight="700" fill="#111827">Reading it</text>
    <text x="556" y="322" fill="#4b5563">• center is a <tspan font-weight="700">logical</tspan> origin, not a metric singularity</text>
    <text x="556" y="342" fill="#4b5563">• rings = a causal <tspan font-weight="700">partial order</tspan>, NOT total ⟹</text>
    <text x="556" y="360" fill="#4b5563">  spacelike events exist, so <tspan font-weight="700">no global time</tspan></text>
    <text x="556" y="382" fill="#4b5563">• <tspan font-weight="700" fill="#c2410c">fast → slow</tspan>: high-f closures resolve first;</text>
    <text x="556" y="400" fill="#4b5563">  the outer shell is the slowest stable composite</text>
    <text x="556" y="422" fill="#4b5563">• <tspan font-weight="700">fractal</tspan>: the same ZFA rule at every octave —</text>
    <text x="556" y="440" fill="#4b5563">  zoom any ring ⟹ another cascade, only slower</text>
  </g>

  <text x="410" y="512" text-anchor="middle" font-size="11" fill="#9ca3af">QLF_LogicalBang.lean — first_distinction_closes · causal_order_not_total · fast_resolves_before_slow · cascade_floored_at_every_scale</text>
</svg>
