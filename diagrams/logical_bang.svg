<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">The logical bang — nested phases, drawn from the inside</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#6b7280">a logical origin + nested phase structure; time is local and multi-directional (no global axis)</text>

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <g transform="translate(300,250)">
    <!-- concentric phase rings -->
    <circle r="185" fill="none" stroke="#c4b5fd" stroke-width="1.6"/>
    <circle r="140" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
    <circle r="95"  fill="none" stroke="#93c5fd" stroke-width="1.6"/>
    <circle r="52"  fill="none" stroke="#7dd3fc" stroke-width="1.6"/>

    <!-- radial "time in every direction" arrows -->
    <g stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)">
      <line x1="0" y1="0" x2="0"    y2="-176"/>
      <line x1="0" y1="0" x2="124"  y2="-124"/>
      <line x1="0" y1="0" x2="176"  y2="0"/>
      <line x1="0" y1="0" x2="124"  y2="124"/>
      <line x1="0" y1="0" x2="0"    y2="176"/>
      <line x1="0" y1="0" x2="-124" y2="124"/>
      <line x1="0" y1="0" x2="-176" y2="0"/>
      <line x1="0" y1="0" x2="-124" y2="-124"/>
    </g>

    <!-- the logical bang: the first distinction -->
    <circle r="30" fill="url(#core)" stroke="#b45309" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">LOGICAL</text>
    <text x="0" y="10" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">BANG</text>

    <!-- nucleons on the outer ring (first persistent matter closures) -->
    <g fill="#7c3aed">
      <circle cx="0"    cy="-185" r="5"/><circle cx="131" cy="-131" r="5"/><circle cx="185" cy="0" r="5"/>
      <circle cx="131"  cy="131"  r="5"/><circle cx="0"   cy="185"  r="5"/><circle cx="-131" cy="131" r="5"/>
      <circle cx="-185" cy="0"    r="5"/><circle cx="-131" cy="-131" r="5"/>
    </g>
  </g>

  <!-- ring labels -->
  <text x="300" y="185" text-anchor="middle" font-size="11" fill="#0369a1">conjugate pair [+,−]</text>
  <text x="300" y="118" text-anchor="middle" font-size="11" fill="#1d4ed8">nested closures · octave shells</text>
  <text x="588" y="253" font-size="11" fill="#6d28d9">nucleons (Borromean baryons)</text>
  <text x="588" y="269" font-size="10" fill="#9ca3af">the first persistent matter closures</text>

  <!-- side annotations -->
  <text x="612" y="330" font-size="12" font-weight="700" fill="#111827">Center</text>
  <text x="612" y="347" font-size="11" fill="#374151">the first distinction —</text>
  <text x="612" y="362" font-size="11" fill="#374151">the minimal ZFA closure</text>
  <text x="612" y="377" font-size="11" fill="#374151">(logical, not metric)</text>

  <text x="30" y="330" font-size="12" font-weight="700" fill="#111827">Rings = phases</text>
  <text x="30" y="347" font-size="11" fill="#374151">a causal partial order,</text>
  <text x="30" y="362" font-size="11" fill="#374151">NOT total — spacelike</text>
  <text x="30" y="377" font-size="11" fill="#374151">events exist ⟹ no</text>
  <text x="30" y="392" font-size="11" fill="#374151">global time line</text>

  <text x="380" y="452" text-anchor="middle" font-size="11.5" fill="#6b7280">From inside any ring the inward direction reads as "the beginning of time" — the inner boundary of that phase (QLF_LogicalBang).</text>
</svg>
