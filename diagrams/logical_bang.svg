<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">The logical bang — nested phases, drawn from the inside</text>
  <text x="410" y="52" text-anchor="middle" font-size="13" fill="#6b7280">a logical origin + nested phase structure; time is local and multi-directional (no global axis)</text>

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <g transform="translate(280,280)">
    <!-- concentric phase rings -->
    <circle r="190" fill="none" stroke="#c4b5fd" stroke-width="1.6"/>
    <circle r="145" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
    <circle r="100" fill="none" stroke="#93c5fd" stroke-width="1.6"/>
    <circle r="55"  fill="none" stroke="#7dd3fc" stroke-width="1.6"/>

    <!-- radial "time in every direction" arrows (no single global axis) -->
    <g stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ar)">
      <line x1="0" y1="0" x2="128"  y2="-128"/><line x1="0" y1="0" x2="182" y2="0"/>
      <line x1="0" y1="0" x2="128"  y2="128"/><line x1="0" y1="0" x2="0"   y2="182"/>
      <line x1="0" y1="0" x2="-128" y2="128"/><line x1="0" y1="0" x2="-182" y2="0"/>
      <line x1="0" y1="0" x2="-128" y2="-128"/>
    </g>

    <!-- nucleons on the outer ring (offset so none sits under a label) -->
    <g fill="#7c3aed">
      <circle cx="175.5" cy="72.8" r="5.5"/><circle cx="72.7" cy="175.5" r="5.5"/>
      <circle cx="-72.7" cy="175.5" r="5.5"/><circle cx="-175.5" cy="72.8" r="5.5"/>
      <circle cx="-175.5" cy="-72.8" r="5.5"/><circle cx="-72.7" cy="-175.5" r="5.5"/>
      <circle cx="72.7" cy="-175.5" r="5.5"/><circle cx="175.5" cy="-72.8" r="5.5"/>
    </g>
    <!-- a couple of nucleons named -->
    <text x="188" y="76" font-size="11" font-weight="700" fill="#5b21b6">p</text>
    <text x="82"  y="192" font-size="11" font-weight="700" fill="#5b21b6">n</text>
    <text x="-95" y="192" font-size="11" font-weight="700" fill="#5b21b6">p</text>

    <!-- the logical bang: the first distinction (phase 0) -->
    <circle r="30" fill="url(#core)" stroke="#b45309" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">LOGICAL</text>
    <text x="0" y="10" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">BANG</text>

    <!-- numbered phase badges at 12 o'clock on each ring -->
    <g>
      <circle cx="0" cy="-190" r="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="0" y="-186" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">4</text>
      <circle cx="0" cy="-145" r="11" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/><text x="0" y="-141" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">3</text>
      <circle cx="0" cy="-100" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="0" y="-96"  text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">2</text>
      <circle cx="0" cy="-55"  r="11" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/><text x="0" y="-51"  text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">1</text>
    </g>
  </g>

  <!-- legend: the phases -->
  <g font-size="12.5">
    <text x="556" y="112" font-size="13" font-weight="700" fill="#111827">The phases (inner → outer)</text>
    <circle cx="566" cy="140" r="11" fill="url(#core)" stroke="#b45309" stroke-width="1.3"/><text x="566" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">0</text>
    <text x="586" y="144" fill="#374151"><tspan font-weight="700">Logical bang</tspan> — the first distinction (minimal ZFA closure [+,−])</text>
    <circle cx="566" cy="172" r="11" fill="#fff" stroke="#0ea5e9" stroke-width="1.4"/><text x="566" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">1</text>
    <text x="586" y="176" fill="#374151"><tspan font-weight="700">Conjugate pairs</tspan> — the first closures</text>
    <circle cx="566" cy="204" r="11" fill="#fff" stroke="#2563eb" stroke-width="1.4"/><text x="566" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">2</text>
    <text x="586" y="208" fill="#374151"><tspan font-weight="700">Octave cascade</tspan> — the turbulent tangle (log 2 / octave)</text>
    <circle cx="566" cy="236" r="11" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="566" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">3</text>
    <text x="586" y="240" fill="#374151"><tspan font-weight="700">Light nuclei</tspan> — primordial matter (⁴He, …)</text>
    <circle cx="566" cy="268" r="11" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="566" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">4</text>
    <text x="586" y="272" fill="#374151"><tspan font-weight="700">Nucleons</tspan> — Borromean baryons (protons p, neutrons n)</text>

    <text x="556" y="320" font-size="13" font-weight="700" fill="#111827">Reading it</text>
    <text x="556" y="344" fill="#4b5563">• center is a <tspan font-weight="700">logical</tspan> origin, not a metric singularity</text>
    <text x="556" y="366" fill="#4b5563">• rings = a causal <tspan font-weight="700">partial order</tspan>, NOT total —</text>
    <text x="556" y="384" fill="#4b5563">  spacelike events exist ⟹ <tspan font-weight="700">no global time line</tspan></text>
    <text x="556" y="406" fill="#4b5563">• from inside a ring, <tspan font-weight="700">inward</tspan> reads as a beginning</text>
  </g>

  <text x="410" y="484" text-anchor="middle" font-size="11" fill="#9ca3af">QLF_LogicalBang.lean — first_distinction_closes · causal_order_not_total · phase_is_future_cone · baryon_needs_all_three_axes</text>
</svg>
